
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Stadium Arena</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f4f6f9;
        }

        .payment-card {
            max-width: 520px;
            margin: 50px auto;
            border: none;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>
    
<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            🏟️ Stadium Arena Booking
        </a>

        <a href="index.html" class="btn btn-outline-light">
            🏠 Home
        </a>
    </div>
</nav>

    <div class="container">
        <div class="card payment-card">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-4">Booking & Payment</h3>

                <div id="payment-error" class="alert alert-danger d-none"></div>

                <div class="mb-3">
                    <label class="form-label">Schedule ID</label>
                    <div id="schedule-display" class="form-control bg-light"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Selected Seat</label>
                    <div id="seat-display" class="form-control bg-light fw-bold"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Your Full Name</label>
                    <input
                        type="text"
                        id="customer-name"
                        class="form-control"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <hr>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <span class="fw-bold">Total Amount</span>
                    <h4 id="total-amount" class="text-success fw-bold mb-0">
                        Loading...
                    </h4>
                </div>

                <button id="pay-button" class="btn btn-success w-100 fw-bold py-2">
                    Confirm Booking
                </button>

                <a id="back-button" href="#" class="btn btn-outline-secondary w-100 mt-2">
                    Back to Seats
                </a>

                <p class="text-muted small mt-3 mb-0">
                    Demo only: this confirms a booking without collecting payment details
                    or charging money.
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);

        const scheduleId = params.get("schedule_id");
        const seatId = params.get("seat_id");
        const seatNumber = params.get("seat");

        const API_BASE = "http://127.0.0.1:8000/api";
        const SCHEDULE_API = `${API_BASE}/schedules/${scheduleId}/`;
        const SEATS_API = `${API_BASE}/schedules/${scheduleId}/seats/`;
        const BOOKING_API = `${API_BASE}/bookings/`;

        let ticketPrice = 0;

        const payButton = document.getElementById("pay-button");
        const errorBox = document.getElementById("payment-error");

        document.getElementById("schedule-display").textContent =
            scheduleId || "Not provided";

        document.getElementById("seat-display").textContent =
            seatNumber || "Not provided";

        document.getElementById("back-button").href =
            `booking.html?schedule_id=${encodeURIComponent(scheduleId || "")}`;

        async function loadPaymentDetails() {
            if (!scheduleId || !seatId || !seatNumber) {
                showError("Missing schedule or seat information. Return to seat selection.");
                payButton.disabled = true;
                return;
            }

            try {
                const [scheduleResponse, seatsResponse] = await Promise.all([
                    axios.get(SCHEDULE_API),
                    axios.get(SEATS_API)
                ]);

                const schedule = scheduleResponse.data;

                const seat = seatsResponse.data.find(
                    item =>
                        String(item.id) === String(seatId) &&
                        item.seat_number === seatNumber
                );

                if (!seat) {
                    showError("This seat could not be found. Please select another seat.");
                    payButton.disabled = true;
                    return;
                }

                if (seat.is_booked) {
                    showError("This seat has already been booked. Please choose another seat.");
                    payButton.disabled = true;
                    return;
                }

                ticketPrice = Number(schedule.regular_price);

                if (!Number.isFinite(ticketPrice) || ticketPrice < 0) {
                    showError("The ticket price is invalid.");
                    payButton.disabled = true;
                    return;
                }

                document.getElementById("total-amount").textContent =
                    `₹${ticketPrice.toFixed(2)}`;
            } catch (error) {
                console.error(error);
                showError("Unable to load payment details. Check your Django server.");
                payButton.disabled = true;
            }
        }

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.remove("d-none");
        }

        payButton.addEventListener("click", async () => {
            errorBox.classList.add("d-none");

            const customerName = document.getElementById("customer-name")
                .value.trim();

            if (!customerName) {
                showError("Please enter your full name.");
                return;
            }

            if (!scheduleId || !seatId || !seatNumber || ticketPrice <= 0) {
                showError("Booking details are invalid. Please return to seat selection.");
                return;
            }

            payButton.disabled = true;
            payButton.textContent = "Processing...";

            try {
                // Re-check availability immediately before creating the booking.
                const seatsResponse = await axios.get(SEATS_API);

                const latestSeat = seatsResponse.data.find(
                    item =>
                        String(item.id) === String(seatId) &&
                        item.seat_number === seatNumber
                );

                if (!latestSeat || latestSeat.is_booked) {
                    showError("Sorry, this seat is no longer available.");
                    payButton.disabled = false;
                    payButton.textContent = "Confirm Booking";
                    return;
                }

                await axios.post(BOOKING_API, {
                    schedule: Number(scheduleId),
                    customer_name: customerName,
                    seat_category: "Regular",
                    selected_seats: seatNumber,
                    total_amount: ticketPrice.toFixed(2)
                });

                alert(
                    `Booking confirmed!\nSeat: ${seatNumber}\n` +
                    `Amount: ₹${ticketPrice.toFixed(2)}`
                );

                window.location.href =
                    `booking.html?schedule_id=${encodeURIComponent(scheduleId)}`;
            } catch (error) {
                console.error(error);

                const detail = error.response?.data
                    ? JSON.stringify(error.response.data)
                    : "Please check your connection and try again.";

                showError(`Booking failed: ${detail}`);
                payButton.disabled = false;
                payButton.textContent = "Confirm Booking";
            }
        });

        loadPaymentDetails();
    </script>
</body>
</html>
