
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stadium Arena Booking</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">

            <a class="navbar-brand fw-bold" href="home.html">
                🏟️ Stadium Arena Booking
            </a>

            <!-- Login, Register or Logout buttons -->
            <div id="auth-buttons" class="d-flex gap-2"></div>

        </div>
    </nav>


    <!-- Main Content -->
    <div class="container my-5">

        <h2 class="mb-4 text-center fw-bold">
            Upcoming Stadium Events & Matches
        </h2>

        <div id="event-list" class="row g-4"></div>

    </div>


    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>

        const API_URL = "http://127.0.0.1:8000/api/events/";

        const eventListContainer = document.getElementById("event-list");
        const authButtons = document.getElementById("auth-buttons");


        // ----------------------------------
        // 1. UPDATE NAVBAR BUTTONS
        // ----------------------------------
        function updateAuthButtons() {

            const accessToken = sessionStorage.getItem("access_token");

            if (accessToken) {

                authButtons.innerHTML = `
                    <button
                        type="button"
                        id="logout-btn"
                        class="btn btn-outline-light">
                        Logout
                    </button>
                `;

                document.getElementById("logout-btn")
                    .addEventListener("click", logoutUser);

            } else {

                authButtons.innerHTML = `
                    <a href="login%20page.html"
                       class="btn btn-outline-light">
                        Login
                    </a>

                    <a href="registration.html"
                       class="btn btn-danger">
                        Register
                    </a>
                `;
            }
        }


        // ----------------------------------
        // 2. LOGOUT USER
        // ----------------------------------
        function logoutUser() {

            sessionStorage.removeItem("access_token");
            sessionStorage.removeItem("refresh_token");
            sessionStorage.removeItem("pending_schedule_id");

            window.location.href = "index.html";
        }


        // ----------------------------------
        // 3. REQUIRE LOGIN BEFORE BOOKING
        // ----------------------------------
        function openBooking(scheduleId) {

            const accessToken = sessionStorage.getItem("access_token");

            if (!accessToken) {

                // Save the selected schedule ID
                sessionStorage.setItem(
                    "pending_schedule_id",
                    scheduleId
                );

                // Open the actual login page
                window.location.href = "login%20page.html";

                return;
            }

            // Open the selected schedule
            window.location.href =
                `booking.html?schedule_id=${encodeURIComponent(scheduleId)}`;
        }


        // ----------------------------------
        // 4. GET EVENT BANNER URL
        // ----------------------------------
        function getBannerUrl(banner) {

            if (!banner) {
                return null;
            }

            // Banner already has a complete URL
            if (
                banner.startsWith("http://") ||
                banner.startsWith("https://")
            ) {
                return banner;
            }

            // Django media paths
            if (banner.startsWith("/media/")) {
                return `http://127.0.0.1:8000${banner}`;
            }

            if (banner.startsWith("media/")) {
                return `http://127.0.0.1:8000/${banner}`;
            }

            if (banner.startsWith("/")) {
                return `http://127.0.0.1:8000${banner}`;
            }

            return `http://127.0.0.1:8000/media/${banner}`;
        }


        // ----------------------------------
        // 5. FETCH EVENTS FROM DJANGO API
        // ----------------------------------
        async function fetchEvents() {

            eventListContainer.innerHTML = `
                <div class="col-12 text-center text-muted">
                    Loading events...
                </div>
            `;

            try {

                const response = await axios.get(API_URL);
                const events = response.data;

                eventListContainer.innerHTML = "";

                if (!Array.isArray(events) || events.length === 0) {

                    eventListContainer.innerHTML = `
                        <div class="col-12">
                            <p class="text-center text-muted">
                                No stadium events available right now.
                            </p>
                        </div>
                    `;

                    return;
                }


                // Display each event
                events.forEach(event => {

                    const bannerUrl = getBannerUrl(event.banner);

                    // Get the first schedule ID
                    const scheduleId =
                        Array.isArray(event.schedules) &&
                        event.schedules.length > 0
                            ? (
                                typeof event.schedules[0] === "object"
                                    ? event.schedules[0].id
                                    : event.schedules[0]
                              )
                            : null;


                    // Create event card
                    const card = document.createElement("div");

                    card.className = "col-12 col-md-6 col-lg-4";


                    card.innerHTML = `
                        <div class="card h-100 shadow-sm border-0">

                            ${
                                bannerUrl
                                    ? `
                                        <img
                                            src="${bannerUrl}"
                                            class="card-img-top"
                                            alt="Event banner"
                                            style="
                                                height: 250px;
                                                object-fit: cover;
                                            "
                                            onerror="
                                                this.style.display='none';
                                                this.nextElementSibling.style.display='flex';
                                            "
                                        >

                                        <div
                                            class="bg-dark text-white align-items-center justify-content-center"
                                            style="
                                                height: 250px;
                                                display: none;
                                            "
                                        >
                                            Banner unavailable
                                        </div>
                                    `
                                    : `
                                        <div
                                            class="bg-dark text-white d-flex align-items-center justify-content-center"
                                            style="height: 250px;"
                                        >
                                            No Banner Available
                                        </div>
                                    `
                            }

                            <div class="card-body d-flex flex-column">

                                <h5 class="card-title fw-bold">
                                    ${event.title ?? "Untitled Event"}
                                </h5>

                                <p class="text-muted small mb-2">

                                    <strong>Category:</strong>

                                    <span class="badge bg-primary">
                                        ${event.category ?? "General"}
                                    </span>

                                    <br>

                                    <strong>Teams/Artists:</strong>
                                    ${event.artists_or_teams ?? "Not specified"}

                                </p>

                                <p class="card-text">
                                    ${event.description ?? "No description available."}
                                </p>

                                <button
                                    type="button"
                                    class="btn btn-success mt-auto book-btn"
                                    ${scheduleId == null ? "disabled" : ""}
                                >
                                    ${
                                        scheduleId == null
                                            ? "No Schedule Available"
                                            : "Book Stadium Seats"
                                    }
                                </button>

                            </div>
                        </div>
                    `;


                    // Add booking button functionality
                    const bookButton = card.querySelector(".book-btn");

                    if (scheduleId != null) {

                        bookButton.addEventListener("click", function () {

                            openBooking(scheduleId);

                        });

                    }


                    // Add event card to page
                    eventListContainer.appendChild(card);

                });

            } catch (error) {

                console.error("Error fetching events:", error);

                eventListContainer.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger text-center">
                            Failed to load events.
                            Please make sure your Django server is running.
                        </div>
                    </div>
                `;
            }
        }


        // ----------------------------------
        // 6. START PAGE
        // ----------------------------------
        updateAuthButtons();
        fetchEvents();

    </script>

</body>

</html>
