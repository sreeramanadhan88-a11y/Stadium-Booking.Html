
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Stadium Booking</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f4f4f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 100%;
            max-width: 450px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .brand {
            color: #e50914;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="register-card">
        <h2 class="text-center brand mb-2">Stadium Booking</h2>
        <p class="text-center text-muted mb-4">Create your account</p>

        <form id="register-form">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input
                    type="text"
                    id="username"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                    type="email"
                    id="email"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    id="password"
                    class="form-control"
                    minlength="8"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="confirm-password" class="form-label">
                    Confirm Password
                </label>
                <input
                    type="password"
                    id="confirm-password"
                    class="form-control"
                    minlength="8"
                    required
                >
            </div>

            <div id="message" class="mb-3" role="alert"></div>

            <button type="submit" class="btn btn-danger w-100">
                Create Account
            </button>
        </form>

        <p class="text-center mt-3 mb-0">
            Already have an account?
            <a href="login page.html" class="text-danger fw-bold">
    Login Here
</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="register.js"></script>
</body>
</html>
